name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck -S warning install.sh uninstall.sh tests/run.sh wol/spells/*.sh wol/crystal/*.sh
      - name: Generated files are up to date
        run: |
          python3 tools/gen_agents.py && python3 tools/gen_skills.py
          git diff --exit-code -- agents skills
      - name: Spell tests
        run: tests/run.sh
